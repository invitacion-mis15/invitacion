<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mis 15 - Agustina</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #050308;
            font-family: 'Montserrat', sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
            overflow-x: hidden;
            position: relative;
        }

        .invitation-card {
            width: 100%;
            max-width: 430px;
            min-height: 800px;
            background: linear-gradient(180deg, rgba(5, 3, 8, 0.3) 0%, rgba(5, 3, 8, 0.6) 60%, rgba(5, 3, 8, 0.95) 100%), 
                        url('torre.jpg') no-repeat center center / cover;
            border-radius: 28px;
            padding: 30px 20px;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .header-subtitle {
            font-family: 'Cinzel', serif;
            letter-spacing: 4px;
            font-size: 0.85rem;
            color: #f3e5ff;
            text-transform: uppercase;
            font-weight: 700;
            margin-top: 15px;
            margin-bottom: 5px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.9);
            text-align: center;
        }

        .main-title {
            font-family: 'Pinyon Script', cursive;
            font-size: 4.8rem;
            color: #ffffff;
            line-height: 1.1;
            margin: 5px 0 8px 0;
            font-weight: normal;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.8), 2px 2px 8px rgba(0,0,0,0.9);
            text-align: center;
        }

        .main-title-sub {
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            letter-spacing: 5px;
            color: #ffd700;
            font-weight: 700;
            margin-bottom: 20px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.9);
            text-align: center;
        }

        .divider {
            width: 70px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #ffd700, transparent);
            margin: 18px auto;
        }

        .phrase {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 0.95rem;
            color: #ffffff;
            line-height: 1.6;
            margin-bottom: 25px;
            padding: 14px 15px;
            background: rgba(15, 8, 25, 0.65);
            border-radius: 15px;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 215, 0, 0.3);
            text-shadow: 1px 1px 4px rgba(0,0,0,0.9);
            text-align: center;
        }

        .flower-sparkle {
            position: fixed;
            width: 8px;
            height: 8px;
            background: radial-gradient(circle, #fff7bd 0%, #ffd700 60%, transparent 100%);
            border-radius: 50%;
            box-shadow: 0 0 12px #ffd700, 0 0 20px #ffae00;
            pointer-events: none;
            z-index: 9998;
            animation: floatSparkle 6s ease-in-out infinite;
        }

        @keyframes floatSparkle {
            0% { transform: translateY(0) scale(0.6); opacity: 0; }
            50% { opacity: 0.9; transform: translateY(-40px) scale(1.2); }
            100% { transform: translateY(-80px) scale(0.2); opacity: 0; }
        }

        .rapunzel-lantern {
            position: fixed;
            width: 28px;
            height: 40px;
            background: linear-gradient(180deg, #fff3cc 0%, #ffc107 55%, #e67e22 100%);
            border-radius: 5px 5px 8px 8px;
            box-shadow: 0 0 18px rgba(255, 193, 7, 0.9), 0 0 30px rgba(230, 126, 34, 0.6);
            pointer-events: none;
            z-index: 9999;
            animation: floatUpClick 7s ease-out forwards;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .lantern-sun {
            width: 14px;
            height: 14px;
            background-color: #a03000;
            opacity: 0.85;
            mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><polygon points="50,0 63,35 100,35 70,57 82,91 50,70 18,91 30,57 0,35 37,35"/></svg>') no-repeat center/contain;
            -webkit-mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><polygon points="50,0 63,35 100,35 70,57 82,91 50,70 18,91 30,57 0,35 37,35"/></svg>') no-repeat center/contain;
        }

        @keyframes floatUpClick {
            0% { transform: translate(-50%, -50%) scale(0.4) rotate(0deg); opacity: 0; }
            15% { opacity: 1; transform: translate(-50%, -80px) scale(1) rotate(-3deg); }
            85% { opacity: 0.8; }
            100% { transform: translate(-50%, -100vh) scale(0.8) rotate(6deg); opacity: 0; }
        }

            background: rgba(20, 10, 32, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 215, 0, 0.35);
            border-radius: 18px;
            padding: 20px 16px;
